services:

  # MariaDB Service
  spaceshelf-db:
    image: mariadb:11.4.13
    restart: unless-stopped
    tty: true
    volumes:
     - spaceshelf-dbdata:/var/lib/mysql
     - ./mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      # Bound to localhost by default: this dev stack runs with the root
      # password from compose below, so the DB must not sit open on the LAN.
      # Set DB_BIND=0.0.0.0 in .env to re-expose (e.g. GUI clients on other
      # machines), and change the root password before doing so.
      - "${DB_BIND:-127.0.0.1}:${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: laravel
      MARIADB_ROOT_PASSWORD: toor
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    networks:
      app-network:
        aliases:
          - ogame-db

  # PHP Service
  spaceshelf-app:
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPCACHE_ENABLE: "0"  # Disable opcache for development
        USE_USER: ${USE_USER_ARG:-yes}  # Defaults to "yes". Set to "no" for GitHub Actions.
    restart: unless-stopped
    tty: true
    environment:
      CONTAINER_ROLE: app
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000 || [ $? -eq 56 ]"]
      interval: 10s
      timeout: 6s
      retries: 60
    networks:
      - app-network
    depends_on:
      - spaceshelf-db

  # Scheduler
  spaceshelf-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: scheduler
    networks:
      - app-network
    depends_on:
      spaceshelf-app:
        condition: service_healthy

  # Queue
  spaceshelf-queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: queue
    networks:
      - app-network
    depends_on:
      spaceshelf-app:
        condition: service_healthy

  # Nginx Service
  spaceshelf-webserver:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    tty: true
    volumes:
      - ./:/var/www:cached
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/ssl/:/etc/nginx/ssl/
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - app-network
    depends_on:
      spaceshelf-app:
        condition: service_healthy

  # Reverb WebSocket Server
  spaceshelf-reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: reverb
    ports:
      - "${REVERB_SERVER_PORT:-8090}:${REVERB_SERVER_PORT:-8090}"
    networks:
      - app-network
    depends_on:
      spaceshelf-app:
        condition: service_healthy

  # PhpMyAdmin
  spaceshelf-phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: always
    ports:
      # Local admin tool: keep it off the LAN, and no arbitrary-server
      # login mode (PMA_ARBITRARY would turn it into an SSRF/credential
      # probe against any host it can reach).
      - "${PHPMYADMIN_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-8080}:80"
    environment:
      - PMA_ARBITRARY=0
      - PMA_HOST=ogame-db
      - UPLOAD_LIMIT=1G
    networks:
      - app-network

# Docker Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  spaceshelf-dbdata:
    driver: local
